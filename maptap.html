<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MapTap League 🗺️</title>

    <link rel="stylesheet" href="maptapstyle.css">

    <!-- Firebase -->
    <script type="module" src="firebase.js"></script>

    <script type="module" src="app.js"></script>
</head>
<body>

<header>
    <h1>🗺️ MAPTAP LEAGUE</h1>
    <p id="week-title">Loading week...</p>
</header>

<main>

    <section class="winner-card hidden" id="winner-card">
        <h2>🏆 Weekly Winner</h2>
        <h1 id="winner-name">-</h1>
        <p id="winner-score">-</p>
    </section>

    <section class="card">
        <h2>Enter Today's Score</h2>

        <div class="entry-form">
            <label for="player-select">Who are you?</label>
            <select id="player-select">
                <option value="" disabled selected>Loading players...</option>
            </select>

            <label for="score-paste">Paste your score</label>
            <textarea
                id="score-paste"
                rows="3"
                placeholder="Paste your MapTap share text here, or just type your final score"
            ></textarea>

            <div id="score-preview" class="score-preview hidden"></div>

            <button id="submit-score">📋 Submit Score</button>

            <p id="entry-message" class="entry-message"></p>
        </div>
    </section>

    <section class="card">
        <h2>Today's Entries</h2>
        <div id="today-entries">Loading players...</div>
    </section>

    <section class="card">
        <h2>Current Standings</h2>

        <table>
            <thead>
                <tr>
                    <th>Position</th>
                    <th>Player</th>
                    <th>Points</th>
                    <th>Played</th>
                </tr>
            </thead>

            <tbody id="leaderboard">
                <tr>
                    <td colspan="4">Loading...</td>
                </tr>
            </tbody>
        </table>
    </section>

    <section class="card">
        <h2>Previous Winners</h2>

        <div id="history">
            Loading history...
        </div>
    </section>

</main>

<footer>
    <p>MapTap League © 2026</p>
</footer>


</body>
</html>
